name: CI - MLflow Training & Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-deploy:
    name: Train Model & Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Verify runtime environment
        run: |
          python --version
          pip --version
          docker --version

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 \
                      pandas==2.2.3 numpy==1.26.4 \
                      matplotlib==3.9.2 dagshub==0.3.36 \
                      boto3

      - name: Configure MLflow tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_OWNER }}/${{ secrets.DAGSHUB_REPO }}.mlflow" >> $GITHUB_ENV

      - name: Train model via MLflow project
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject/ \
            --env-manager=local \
            --experiment-name "Credit Risk CI Pipeline"

      - name: Resolve latest MLflow run ID
        id: get_run_id
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          RUN_ID=$(python - <<'EOF'
          import mlflow
          client = mlflow.MlflowClient()
          exp = client.get_experiment_by_name("Credit Risk CI Pipeline")
          runs = client.search_runs(
              experiment_ids=[exp.experiment_id],
              order_by=["start_time DESC"],
              max_results=1,
          )
          print(runs[0].info.run_id)
          EOF
          )
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Resolved Run ID: $RUN_ID"

      - name: Download and commit model artifacts
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import mlflow, os
          client = mlflow.MlflowClient()
          run_id = "${{ steps.get_run_id.outputs.run_id }}"
          local_dir = "downloaded_artifacts"
          client.download_artifacts(run_id, "", local_dir)
          print(f"Artifacts saved to: {local_dir}")
          for root, dirs, files in os.walk(local_dir):
              for f in files:
                  print(os.path.join(root, f))
          EOF

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_artifacts/ || true
          git diff --staged --quiet || \
            git commit -m "chore: persist model artifacts from run ${{ steps.get_run_id.outputs.run_id }} [skip ci]"
          git push

      - name: Build Docker model image
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.get_run_id.outputs.run_id }}/model" \
            --name "credit-risk-model" \
            --env-manager local

      - name: Tag Docker image for registry
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
          docker tag credit-risk-model:latest "${DOCKER_USER}/credit-risk-model:latest"
          docker tag credit-risk-model:latest "${DOCKER_USER}/credit-risk-model:${{ github.sha }}"

      - name: Authenticate with Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to registry
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
          docker push "${DOCKER_USER}/credit-risk-model:latest"
          docker push "${DOCKER_USER}/credit-risk-model:${{ github.sha }}"

      - name: Summarize pipeline run
        if: always()
        run: |
          echo "run_id=${{ steps.get_run_id.outputs.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "sha=${{ github.sha }}"                         >> $GITHUB_STEP_SUMMARY
          echo "Pipeline completed."