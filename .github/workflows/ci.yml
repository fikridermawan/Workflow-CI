name: CI - MLflow Training & Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-deploy:
    name: Train Model & Build Docker Image
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout kode ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────────────────────
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: 'pip'

      # ── 3. Cek environment ────────────────────────────────────────────────
      - name: Check environment
        run: |
          python --version
          pip --version
          docker --version

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 \
                      pandas==2.2.3 numpy==1.26.4 \
                      matplotlib==3.9.2 dagshub==0.3.36

      # ── 5. Set MLflow Tracking URI ────────────────────────────────────────
      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_OWNER }}/${{ secrets.DAGSHUB_REPO }}.mlflow" >> $GITHUB_ENV

      # ── 6. Jalankan MLflow Project ────────────────────────────────────────
      - name: Run MLflow project
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject/ \
            --env-manager=local \
            --experiment-name "Credit Risk CI Pipeline"

      # ── 7. Ambil Run ID terbaru ───────────────────────────────────────────
      - name: Get latest MLflow run_id
        id: get_run_id
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          RUN_ID=$(python - <<'EOF'
          import mlflow, os
          client = mlflow.MlflowClient()
          exp = client.get_experiment_by_name("Credit Risk CI Pipeline")
          runs = client.search_runs(
              experiment_ids=[exp.experiment_id],
              order_by=["start_time DESC"],
              max_results=1,
          )
          print(runs[0].info.run_id)
          EOF
          )
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Latest Run ID: $RUN_ID"

      # ── 8. Install Python dependencies tambahan ───────────────────────────
      - name: Install Python dependencies for artifact download
        run: pip install boto3

      # ── 9. Upload artefak ke GitHub ───────────────────────────────────────
      - name: Upload model artifacts to GitHub
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import mlflow, os, shutil
          client = mlflow.MlflowClient()
          run_id = "${{ steps.get_run_id.outputs.run_id }}"
          local_dir = "downloaded_artifacts"
          client.download_artifacts(run_id, "", local_dir)
          print(f"Artefak diunduh ke: {local_dir}")
          for root, dirs, files in os.walk(local_dir):
              for f in files:
                  print(os.path.join(root, f))
          EOF

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_artifacts/ || true
          git diff --staged --quiet || git commit -m "ci: upload model artifacts run=${{ steps.get_run_id.outputs.run_id }} [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. Build Docker Image menggunakan mlflow build-docker ────────────
      - name: Build Docker Model Image
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.get_run_id.outputs.run_id }}/model" \
            --name "credit-risk-model" \
            --env-manager local

      # ── 11. Tag Docker Image ──────────────────────────────────────────────
      - name: Tag Docker Image
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
          docker tag credit-risk-model:latest "${DOCKER_USER}/credit-risk-model:latest"
          docker tag credit-risk-model:latest "${DOCKER_USER}/credit-risk-model:${{ github.sha }}"

      # ── 12. Login ke Docker Hub ───────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 13. Push Docker Image ke Docker Hub ──────────────────────────────
      - name: Push Docker Image
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
          docker push "${DOCKER_USER}/credit-risk-model:latest"
          docker push "${DOCKER_USER}/credit-risk-model:${{ github.sha }}"
          echo "Docker image berhasil di-push ke Docker Hub."

      # ── 14. Post log success ──────────────────────────────────────────────
      - name: Post set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
        if: always()

      # ── 15. Complete job ──────────────────────────────────────────────────
      - name: Complete job
        run: |
          echo "================================"
          echo " CI Pipeline selesai!"
          echo " Run ID : ${{ steps.get_run_id.outputs.run_id }}"
          echo " SHA    : ${{ github.sha }}"
          echo "================================"
